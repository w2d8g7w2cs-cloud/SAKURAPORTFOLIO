<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura Project PDF Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            background-color: #f9c1cf;
        }
        h1 { margin: 20px; color: #333; }

        .pdf-container {
            width: 90%;
            height: 70vh;
            border: 2px solid #ccc;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }

        /* YouTube動画用のコンテナ（比率を16:9に保つ設定） */
        .youtube-container {
            width: 90%;
            aspect-ratio: 16 / 9;
            border: 2px solid #ccc;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }

        .youtube-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .model-container {
            width: 90%;
            border: 2px solid #ccc;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body>

    <h1>SAKURA KOREEDA</h1>

    <div class="pdf-container">
        <embed src="SakuraProject1.pdf" type="application/pdf" width="100%" height="100%" />
    </div>

    <!-- YouTube動画の埋め込み -->
    <div class="youtube-container">
        <iframe src="https://www.youtube.com/embed/Q8Ynm7c42fA" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>

    <div class="model-container">
        <model-viewer 
            src="models/Ichigo.glb" 
            alt="3D" 
            auto-rotate 
            camera-controls 
            style="width: 100%; height: 500px; background-color: #f0f0f0;">
        </model-viewer>
    </div>

</body>
</html>
