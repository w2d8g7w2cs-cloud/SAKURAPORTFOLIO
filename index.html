<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOREEDA SAKURA | VIRTUAL PORTFOLIO</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111; 
            font-family: 'Inter', sans-serif;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        h1 {
            margin-top: 80px;
            margin-bottom: 60px;
            font-family: 'Archivo Black', sans-serif;
            font-size: 4rem;
            letter-spacing: -0.05em; 
            color: #fff;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
            text-align: center;
        }

        h1::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -10px;
            width: 100%;
            height: 6px;
            background: #ffe600;
            border-radius: 3px;
            z-index: -1;
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(255, 230, 0, 0.6); 
        }

  
        .content-section {
            width: 85%;
            max-width: 1200px; 
            margin-bottom: 80px;
            position: relative;
            
            background: transparent;
            
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .content-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .section-label {
            position: absolute;
            top: -30px;
            left: 0;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #888;
            font-weight: 400;
        }

        .media-container {
            overflow: hidden;
            border-radius: 12px;
            background-color: #000;
            border: 1px solid #333; 
        }

        .pdf-container {
            height: 85vh;
        }
        
        .pdf-container embed {
            border: none;
            display: block;
        }


        .youtube-container {
            aspect-ratio: 21 / 9; 
            background: #000;
        }

        .youtube-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .model-container {
            height: 700px;
        }
        
        .model-viewer-custom {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #222 0%, #000 100%);
            --poster-color: transparent; 
            --progress-bar-color: #ff007f; 
        }

        .footer-text {
            margin-bottom: 40px;
            color: #444;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; margin-top: 50px; margin-bottom: 40px; }
            .content-section { width: 95%; margin-bottom: 60px; }
            .section-label { position: relative; top: 0; margin-bottom: 10px; display: block; text-align: left;}
            
            .pdf-container { height: 60vh; }
            .youtube-container { aspect-ratio: 16 / 9; }
            .model-container { height: 400px; }
            .content-section:hover { transform: none; box-shadow: none; } 
        }
    </style>
</head>
<body>

    <h1>KOREEDA SAKURA</h1>
    
    <div class="footer-text">Digital Archive 2026</div>

    <div class="content-section">
        <div class="section-label">PROJECT1</div>
        <div class="media-container pdf-container">
            <embed src="SakuraProject1.pdf" type="application/pdf" width="100%" height="100%" />
        </div>
    </div>

    <div class="content-section">
        <div class="section-label">PROJECT3</div>
        <div class="media-container youtube-container">
            <iframe src="https://www.youtube.com/embed/Q8Ynm7c42fA" 
                    title="YouTube video player" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
            </iframe>
        </div>
    </div>

    <div class="content-section">
        <div class="section-label">Asset Preview</div>
        <div class="media-container model-container">
            <model-viewer 
                class="model-viewer-custom"
                src="models/Ichigo.glb" 
                alt="3D Model Preview" 
                auto-rotate 
                camera-controls
                camera-orbit="0deg 75deg 2m" 
                environment-image="neutral" 
                shadow-intensity="0" 
                reveal="auto">
            </model-viewer>
        </div>
    </div>

    <!-- model-viewer ライブラリの読み込み (必須) -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

</body>
</html>
