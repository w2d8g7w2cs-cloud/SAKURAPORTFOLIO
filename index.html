<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura Project - Elegant Showcase</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=YuMincho:wght@500;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fdf6f7
            font-family: 'Montserrat', 'YuMincho', serif;
            color: #555;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-top: 60px;
            margin-bottom: 40px;
            font-size: 3.5rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: #333;
            position: relative;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
        }

        h1::after {
            content: '🌸';
            position: absolute;
            font-size: 1.5rem;
            right: -25px;
            top: -10px;
            opacity: 0.8;
        }

        .content-wrapper {
            width: 90%;
            max-width: 1000px;
            margin-bottom: 50px;
            
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(219, 112, 147, 0.15); 
            

            border: 1px solid transparent;
            background-clip: padding-box;
            position: relative;
        }

        .content-wrapper::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            background: linear-gradient(45deg, rgba(255,182,193,0.3), rgba(255,255,255,0.1), rgba(255,182,193,0.3));
            z-index: -1;
        }



        .pdf-container {
            height: 75vh;
            overflow: hidden;
            border-radius: 20px; 
        }
        
        .pdf-container embed {
            display: block;
            border: none;
        }



        .youtube-container {
            aspect-ratio: 16 / 9; 
            overflow: hidden;
            border-radius: 20px;
            border: 4px solid #fff; 
            box-sizing: border-box;
        }

        .youtube-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

       
        .model-container {
            border-radius: 20px;
            padding: 10px; 
            background-color: #fff;
            border: 4px solid #fff;
        }
        
        .model-viewer-custom {
            width: 100%;
            height: 600px; 
            background: linear-gradient(to bottom, #ffffff, #f0f0f0); 
            border-radius: 15px;
            --poster-color: #f0f0f0; 
        }

      
        @media (max-width: 768px) {
            h1 { font-size: 2rem; margin-top: 40px; }
            .pdf-container { height: 50vh; }
            .model-viewer-custom { height: 400px; }
            .content-wrapper { margin-bottom: 30px; }
        }
    </style>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body>

    <h1>SAKURA KOREEDA</h1>

    <div class="content-wrapper pdf-container">
        <embed src="SakuraProject1.pdf" type="application/pdf" width="100%" height="100%" />
    </div>

    <div class="content-wrapper youtube-container">
        <iframe src="https://www.youtube.com/embed/Q8Ynm7c42fA" 
                title="YouTube video player" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen></iframe>
    </div>

    <div class="content-wrapper model-container">
        <model-viewer 
            class="model-viewer-custom"
            src="models/Ichigo.glb" 
            alt="Sakura Project 3D Model" 
            auto-rotate 
            camera-controls
            shadow-intensity="1">
        </model-viewer>
    </div>

</body>
</html>
